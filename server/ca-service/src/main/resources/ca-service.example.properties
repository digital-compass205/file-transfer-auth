# Copy to /etc/ca-service/ca-service.properties and adjust for the host.
port=9443

# Server's own TLS identity (a normal cert issued by the internal CA, CN can
# be the CA-service's hostname). PKCS12 keystore containing key + cert chain.
server.keystore=/etc/ca-service/server-identity.p12
server.keystore.password=CHANGE_ME

# OpenSSL CA state (see scripts/init-ca.sh)
ca.openssl.config=/etc/pki/internal-ca/openssl-ca.cnf
ca.cert=/etc/pki/internal-ca/certs/ca.cert.pem
ca.crl=/etc/pki/internal-ca/crl/ca.crl.pem
ca.workdir=/etc/pki/internal-ca/tmp

openssl.binary=openssl

# One-time enrollment tokens (see scripts/issue-token.sh)
ca.tokenstore=/etc/pki/internal-ca/tokens.tsv

log.file=/var/log/ca-service/ca-service.jsonl

# Revocation checking fails closed here too: /renew refuses to issue a new
# certificate when this CRL is missing, unverifiable or stale.
