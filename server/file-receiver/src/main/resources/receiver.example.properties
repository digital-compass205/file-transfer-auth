# Copy to /etc/file-receiver/receiver.properties and adjust for the host.
port=8443

server.keystore=/etc/file-receiver/server-identity.p12
server.keystore.password=CHANGE_ME

ca.cert=/etc/pki/internal-ca/certs/ca.cert.pem
ca.crl=/etc/pki/internal-ca/crl/ca.crl.pem

storage.incoming=/var/lib/file-receiver/incoming
storage.quarantine=/var/lib/file-receiver/quarantine

log.file=/var/log/file-receiver/file-receiver.jsonl

# 2 GiB default cap per upload
upload.max_bytes=2147483648

# The CRL both services read off local disk. Revocation checking fails
# closed: if this file is missing, unparseable, not signed by ca.cert, or
# has aged past its own nextUpdate, every client is rejected with 503
# rather than silently admitted. Keep it fresh with the gen-crl timer in
# deploy/systemd-user/.
