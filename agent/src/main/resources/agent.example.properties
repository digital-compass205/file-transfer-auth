# Copy alongside the agent jar and adjust.
client.id=client-example

# Must be https:// -- the agent refuses to start on a plain http:// URL
# rather than silently giving up TLS, the pinned CA and the hostname check.
ca.service.url=https://ca.internal.example.com:9443
receiver.url=https://receiver.internal.example.com:8443

# Bundled with the installer -- the agent's trust anchor for both servers.
# This is the only source of CA trust: the enrollment response carries the
# issued certificate and nothing the agent would trust as an anchor.
ca.cert=./ca-root.pem

keystore.path=./agent-keystore.p12
keystore.password=CHANGE_ME

watch.folders=./watched
journal.path=./upload-journal.jsonl
log.file=./agent.jsonl

watch.stable_seconds=5
watch.poll_interval_seconds=2
renew.check_interval_hours=6

# Ceiling on a single upload request. Generous by default because a large
# file over a slow link is legitimately slow; the point is that a receiver
# which accepts the connection and then stalls cannot hang the watcher
# forever.
upload.timeout_seconds=3600

# Testing knobs, not for production. renew.check_interval_seconds overrides
# renew.check_interval_hours, and renew.below_fraction overrides the "renew
# once under 40% of lifetime remains" threshold. scripts/local-demo.sh sets
# both so two full rotation cycles can be observed in half a minute.
#renew.check_interval_seconds=5
#renew.below_fraction=1.0
